name: Publish index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download index.html from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --pattern "index.html" --dir .
      - name: Commit index.html to repo root
        run: |
          git config user.name "2086537796-sudo"
          git config user.email "2086537796-sudo@users.noreply.github.com"
          ls -la
          git rm -q .github/workflows/publish-index.yml
          git add index.html
          git status --short
          git commit -m "发图站独立站"
          git push
