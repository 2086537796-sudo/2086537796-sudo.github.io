name: Publish paidang v1.0.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download paidang-v1.0.2 release asset
        run: |
          set -euo pipefail
          curl -fL -o /tmp/paidang-v1.0.2.zip "https://github.com/2086537796-sudo/2086537796-sudo.github.io/releases/download/paidang-v1.0.2/-v1.0.2.zip"
          ls -lh /tmp/paidang-v1.0.2.zip
          unzip -l /tmp/paidang-v1.0.2.zip | head -n 60

      - name: Extract and deploy into paidang/
        run: |
          set -euo pipefail
          rm -rf /tmp/paidang-src
          mkdir -p /tmp/paidang-src
          unzip -q /tmp/paidang-v1.0.2.zip -d /tmp/paidang-src
          # Find the source folder ONLY inside the extracted ZIP.
          # Never search the repo checkout (./paidang) for the source.
          SRC="$(find /tmp/paidang-src -maxdepth 3 -type d -name '派单系统' | head -n 1 || true)"
          if [ -z "$SRC" ]; then
            if [ -f /tmp/paidang-src/master.html ]; then
              SRC="/tmp/paidang-src"
            else
              echo "ERROR: 派单系统 folder not found in ZIP"
              find /tmp/paidang-src -maxdepth 3 | head -n 100
              exit 1
            fi
          fi
          # Guards: refuse the already-deployed folder and the repo root.
          case "$SRC" in
            ./paidang|paidang|.)
              echo "ERROR: refusing unsafe source dir: $SRC"
              exit 1
              ;;
          esac
          case "$SRC" in
            /tmp/paidang-src|/tmp/paidang-src/*)
              ;;
            *)
              echo "ERROR: source dir outside extraction area: $SRC"
              exit 1
              ;;
          esac
          if [ ! -f "$SRC/master.html" ] || [ ! -f "$SRC/acct.html" ]; then
            echo "ERROR: master.html/acct.html missing in source: $SRC"
            ls -la "$SRC"
            exit 1
          fi
          echo "Source dir: $SRC"
          rm -rf paidang
          mkdir -p paidang
          cp -a "$SRC"/. paidang/
          ls -la paidang | head -n 30
          test -f paidang/master.html
          test -f paidang/acct.html

      - name: Commit paidang/ and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paidang
          git rm -q .github/workflows/publish-paidang.yml
          git status --short
          git commit -m "Deploy paidang v1.0.2 (two-mode dispatch)"
          git push
