name: Publish paidang

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download paidang-v1.0.6 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download paidang-v1.0.6 --pattern 'paidang-v1.0.6.zip' --repo "$GITHUB_REPOSITORY"
          echo 'b94281fc06a752ea46e54c3c2442f250323833c893461fce6da9d31980d72e40  paidang-v1.0.6.zip' | sha256sum -c -
          rm -rf paidang
          mkdir -p paidang
          unzip -o paidang-v1.0.6.zip -d paidang
          ls paidang
      - name: Commit and push deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add paidang
          git commit -m 'Deploy paidang v1.0.6'
          git push
      - name: Delete this workflow file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/publish-paidang.yml
          git add -A
          git commit -m 'Remove temporary publish-paidang workflow (v1.0.6)'
          git push
